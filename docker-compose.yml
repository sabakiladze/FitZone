# Local demo stack: SQL Server + API + Web UI.
#   cp .env.example .env   (then edit the values)
#   docker compose up --build
# API Swagger: http://localhost:8080/swagger   UI: http://localhost:8081
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    volumes:
      - fitzone-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: FitZone.WebApi/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development enables Swagger. Demo only.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db;Database=FitZoneDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      JwtTokenSettings__SecretKey: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      UseRealEmail: "false"
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: FitZone.Web/Dockerfile
    depends_on:
      - api
    environment:
      Api__BaseUrl: http://api:8080/
    ports:
      - "8081:8080"

volumes:
  fitzone-data:
